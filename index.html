<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no" />
  <title>Ember Nest — Merge & Decorate</title>
  <link rel="stylesheet" href="style.css" />
</head>
<body>
  <!-- 1. KEEP YOUR EXISTING TOP STATS/HEADER HERE -->
  <div style="display: flex; justify-content: space-between; padding: 10px;">
    <!-- Your coins and energy counters are here -->
  </div>

  <!-- ========================================== -->
  <!-- 2. REPLACE YOUR OLD CONTENT WITH THIS -->
  <!-- ========================================== -->

  <!-- === VIEW 1: THE BOARD (Active by default) === -->
  <div id="view-board" class="view active">
    <div id="hint"></div>
    <div id="perchRow"></div>
    <div id="board"></div>
    
    <div style="display: flex; gap: 10px; justify-content: center; margin-top: 15px;">
      <button id="gather">Gather egg 🥚</button>
      <button id="buyEgg">Buy egg</button>
    </div>
  </div>

  <!-- === VIEW 2: QUESTS === -->
  <div id="view-quests" class="view">
    <div style="text-align: center; margin-bottom: 10px; color: #deb781;">The Mountain's Requests</div>
    <div id="questBox"></div>
  </div>

  <!-- === VIEW 3: THE NEST (Base Building) === -->
  <div id="view-nest" class="view">
    <div style="text-align: center; margin-bottom: 10px; color: #deb781;">Mountain Rooms & Decor</div>
    <div id="mountain"></div>
    <div id="nest"></div>
  </div>

  <!-- === BOTTOM TAB BAR === -->
  <nav id="tabBar">
    <button data-tab="view-board" class="tab-btn active">
      <span class="tab-icon">🐉</span>
      <span class="tab-label">Board</span>
    </button>
    <button data-tab="view-quests" class="tab-btn">
      <span class="tab-icon">📜</span>
      <span class="tab-label">Quests</span>
    </button>
    <button data-tab="view-nest" class="tab-btn">
      <span class="tab-icon">🏕️</span>
      <span class="tab-label">Nest</span>
    </button>
  </nav>

  <!-- ========================================== -->
  <!-- 3. KEEP YOUR SCRIPT TAGS AT THE VERY BOTTOM -->
  <!-- ========================================== -->
  <script src="app.js"></script>
</body>
</html>
