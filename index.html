<!DOCTYPE html>
<html lang="en">
<head>
  <!-- Google Fonts: Playfair Display & Montserrat -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Montserrat:wght@500;700&family=Playfair+Display:wght@600;800&display=swap" rel="stylesheet">
  
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no">
  <title>Ember Nest</title>
  <link rel="icon" href="data:,">
  <link rel="stylesheet" href="style.css">
</head>
<body>

  <div id="app">
    <!-- Top Stats Header -->
    <header id="topBarStats">
      
      <div class="header-left">
        <h1 id="title">Ember <span>Nest</span></h1>
        <div id="nameLine" title="Tap to rename">Keeper</div>
      </div>
      <div class="header-right">
  <button id="bookBtn" class="icon-btn" title="Dragon Book">📖</button>
  <div class="stat-pill">🪙 <span id="coinCount">0</span></div>
  <div class="stat-pill">⚡ <span id="energyCount">5/5</span> <small id="regen"></small></div>
</div>
    </header>

    <!-- === SCROLLABLE VIEWS CONTAINER === -->
    <div class="view-container">
      <!-- === VIEW 1: THE BOARD === -->
      <div id="view-board" class="view active">
        <div id="hint"></div>
          <div id="perchRow"></div>

        <button id="dragonBank" class="dragon-bank-btn">
  <div class="bank-left">
    <span>🐉 Dragon Bank</span>
    <small id="bankTimer" class="bank-timer">Next: 60s</small>
  </div>
  <div style="display:flex; flex-direction:column; align-items:flex-end;">
    <span id="bankCount">0 🪙</span>
    <small id="bankRate" style="font-size:0.65rem; color:#ffcf40;">+0</small>
  </div>
</button>

        <div id="board"></div>
        
        <div class="action-buttons">
          <button id="gather">Gather egg 🥚</button>
          <button id="buyEgg">Buy egg</button>
        </div>
      </div>

      <!-- === VIEW 2: QUESTS === -->
      <div id="view-quests" class="view">
        <div class="section-title">The Mountain's Requests</div>
        <div id="questBox"></div>
      </div>

      <!-- === VIEW 3: THE NEST === -->
      <div id="view-nest" class="view">
        <div class="section-title">Mountain Rooms & Decor</div>
        <div id="mountain"></div>
        <div id="nest"></div>
      </div>
    </div>

    <!-- === BOTTOM TAB BAR === -->
      <nav id="tabBar">
        <button data-tab="view-board" class="tab-btn active">
          <span class="tab-icon">🐉</span>
          <span class="tab-label">Board</span>
        </button>
        <button data-tab="view-quests" class="tab-btn">
          <span class="tab-icon">📜</span>
          <span class="tab-label">Quests</span>
        </button>
        <button data-tab="view-nest" class="tab-btn">
          <span class="tab-icon">🏕️</span>
          <span class="tab-label">Nest</span>
        </button>
      </nav>
  </div>

  <!-- === MODALS & OVERLAYS (REQUIRED FOR JS) === -->
  <div id="toast"></div>

  <div id="chest" class="modal">
    <div class="modal-content">
      <h2 id="chestTitle">Level Up</h2>
      <p id="chestSub"></p>
      <button id="chestBox" class="chest-box">🎁</button>
      <div id="chestLoot"></div>
      <button id="chestOk">Continue</button>
    </div>
  </div>

  <div id="nameBox" class="modal">
    <div class="modal-content">
      <h2>Name Your Nest</h2>
      <p id="nameHint">First change is free.</p>
      <input type="text" id="nameInput" maxlength="16" placeholder="Keeper">
      <div class="modal-buttons">
        <button id="nameNo">Cancel</button>
        <button id="nameGo">Confirm</button>
      </div>
    </div>
  </div>

  <div id="book" class="modal">
    <div class="modal-content book-content">
      <div class="book-header">
        <h2>Dragon Book</h2>
        <button id="bookClose" class="close-btn">✕</button>
      </div>
      <div class="book-tabs">
        <button id="tabMain" class="tab-btn-sub active" onclick="switchBookTab(0)">Main (<span id="bookCount">0</span>)</button>
        <button id="tabRare" class="tab-btn-sub" onclick="switchBookTab(1)">Rare / Shiny</button>
      </div>
      <div id="bookGrid" class="book-grid"></div>
      <div style="margin-top: 15px; text-align: center; border-top: 1px solid var(--border); padding-top: 12px;">
        <button id="resetBookGameBtn" class="danger-btn">Reset All Game Data</button>
      </div>
    </div>
  </div>

  <!-- === WIPE CONFIRMATION MODAL (Required for Reset) === -->
  <div id="wipe" class="modal">
    <div class="modal-content">
      <h2>Reset All Game Data?</h2>
      <p style="font-size: 0.85rem; color: #deb781; margin: 8px 0;">Type <b>Delete</b> below to confirm wiping your save completely:</p>
      <input type="text" id="wipeInput" placeholder="Type Delete" style="width: 100%; padding: 8px; box-sizing: border-box; background: #140b06; border: 1px solid #4a2c17; color: #fff; border-radius: 6px; margin-bottom: 12px;">
      <div class="modal-buttons">
        <button id="wipeNo">Cancel</button>
        <button id="wipeGo" disabled style="opacity: 0.5;">Confirm</button>
      </div>
    </div>
  </div>
  
  <div id="trailWin" class="modal">
    <div class="modal-content">
      <h2>Trail Cleared!</h2>
      <p id="winSub"></p>
      <div id="winLoot"></div>
      <div class="modal-buttons">
        <button id="winHome">Return to Nest</button>
        <button id="winAgain">Run Again</button>
      </div>
    </div>
  </div>

  <div id="trailFail" class="modal">
    <div class="modal-content">
      <h2>Ash Overwhelmed</h2>
      <p id="failWhy"></p>
      <div class="modal-buttons">
        <button id="homeTrail">Back to Nest</button>
        <button id="restartTrail">Try Again</button>
      </div>
    </div>
  </div>

  <script src="app.js"></script>
</body>
</html>
