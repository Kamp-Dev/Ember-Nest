<!doctype html>
<html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><base href="../"><title>Elemental art QA</title>
<style>body{background:#21140e;color:#efd4a0;font:14px sans-serif;margin:20px}.grid{display:grid;grid-template-columns:repeat(auto-fit,minmax(140px,1fr));gap:10px;max-width:660px}figure{margin:0;text-align:center;background:#302016;border:1px solid #654328;padding:8px}img{width:100%;max-width:140px}h2{text-transform:capitalize}</style></head>
<body><h1>Elemental art QA</h1><p>39 dragon sprites and three transparent portrait frames. Elders use only the single-dragon image.</p><main id="gallery"></main>
<script>
const gallery=document.getElementById('gallery');
for(const element of ['fire','water','nature']){
  let html='<h2>'+element+'</h2><div class="grid">';
  for(const stage of ['wyrmling','young','hearth','elder'])for(let count=1;count<=(stage==='elder'?1:4);count++){
    const name=element+'-'+stage+'-'+count;
    html+='<figure><img src="Images/elements/'+name+'.png" alt="'+name+'"><figcaption>'+stage+' ×'+count+'</figcaption></figure>';
  }
  gallery.insertAdjacentHTML('beforeend',html+'</div>');
}
gallery.insertAdjacentHTML('beforeend','<h2>Portrait frames</h2><div class="grid">'+['ember','tide','grove'].map(name=>'<figure><img src="assets/avatar/border_'+name+'_v1.png" alt="'+name+' crown"><figcaption>'+name+'</figcaption></figure>').join('')+'</div>');
</script></body></html>
