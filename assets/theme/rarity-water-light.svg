<svg xmlns="http://www.w3.org/2000/svg" width="192" height="192" viewBox="0 0 192 192">
  <!-- Static organic relief; CSS moves two cached layers, not the noise filter. -->
  <defs>
    <filter id="water" x="0" y="0" width="100%" height="100%" color-interpolation-filters="sRGB">
      <feTurbulence type="fractalNoise" baseFrequency=".025 .032" numOctaves="2" seed="19" stitchTiles="stitch" result="relief"/>
      <feGaussianBlur in="relief" stdDeviation=".8" result="smooth"/>
      <feSpecularLighting in="smooth" surfaceScale="12" specularConstant="1.1" specularExponent="28" lighting-color="#ffffff" result="light">
        <feDistantLight azimuth="225" elevation="55"/>
      </feSpecularLighting>
    </filter>
  </defs>
  <rect width="192" height="192" filter="url(#water)"/>
</svg>
